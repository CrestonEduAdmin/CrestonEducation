<section class="band band--tint" id="route">
  <div class="wrap">
    <div class="head">
      <p class="kicker">Two questions</p>
      <h2>Work out where you actually start</h2>
      <p>Most people arrive knowing they want the diploma and not knowing whether they should be sitting Part I this year, next year, or at all.</p>
    </div>

    <div class="route">
      <div class="route__qs">
        <div>
          <h4>Where are you now?</h4>
          <div class="chips" id="qStage">
            <button data-v="trainee" class="on">In anaesthesia residency</button>
            <button data-v="md">MD / DNB completed</button>
            <button data-v="frca">I hold FRCA / FCAI</button>
            <button data-v="consultant">Consultant, years post-training</button>
          </div>
        </div>
        <div>
          <h4>Where are you trying to get to?</h4>
          <div class="chips" id="qGoal">
            <button data-v="uk" class="on">UK</button>
            <button data-v="eu">Europe</button>
            <button data-v="ie">Ireland</button>
            <button data-v="uae">UAE / Gulf</button>
            <button data-v="nonclin">Out of the OR</button>
          </div>
        </div>
      </div>
      <div class="route__out" id="routeOut"></div>
    </div>
  </div>
</section>
